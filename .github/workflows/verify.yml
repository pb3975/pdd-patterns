name: Check proof patterns and standalone starters
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned proof tools
        run: |
          python -m pip install z3-solver==4.15.4.0
          curl -fL https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.0-linux/bin" >> "$GITHUB_PATH"
          curl -fL https://codeload.github.com/bendlang/bend/tar.gz/ca77ef289bf6e199a0cb95adb9804c0f58d991f0 -o "$RUNNER_TEMP/bend.tar.gz"
          echo "fe358d46fdc40f3f89368e3fdd80280492afcde8d1b2403995b4322cbef0feb6  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP"
          echo "BEND_SOURCE=$RUNNER_TEMP/bend-ca77ef289bf6e199a0cb95adb9804c0f58d991f0" >> "$GITHUB_ENV"
      - name: Check all copied starters and semantic mutations
        run: python scripts/verify.py
